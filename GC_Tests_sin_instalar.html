ma 2"},{"id":"pdf-027","tema":2,"question":"¿Cuál es una desventaja de los modelos CSG (Geometría Sólida Constructiva)?","options":["Complejidad en la implementación de operaciones booleanas","Incapacidad para representar objetos compuestos","Dificultad para realizar operaciones de rotación","Bajo nivel de precisión en el modelado"],"correct":0,"hint":"Recuerda la combinación de sólidos mediante operaciones de conjuntos.","explanation":"En CSG se construyen sólidos mediante uniones, intersecciones y diferencias entre primitivas; implementar estas operaciones puede ser complejo.","source":"PDF Test Parcial 1","sourceUrl":null,"page":7,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2"},{"id":"pdf-028","tema":2,"question":"¿Qué tipo de técnica de modelado permite modificar localmente la forma mediante el uso de \"knots\" o nudos?","options":["Superficies cuadráticas","NURBS","Superficies libres","Modelos poligonales"],"correct":1,"hint":"Busca una superficie controlada por pesos y nudos.","explanation":"Las NURBS emplean puntos de control, pesos y nudos para controlar curvas o superficies con flexibilidad.","source":"PDF Test Parcial 1","sourceUrl":null,"page":7,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2"},{"id":"pdf-029","tema":2,"question":"¿Qué método de creación de modelos sólidos se basa en utilizar figuras simples, como cubos o cilindros, con parámetros ajustables?","options":["Barrido","Enumeración espacial","Instanciación de primitivas","CSG"],"correct":2,"hint":"¿Cómo crearías muchas variantes de un cilindro?","explanation":"La instanciación utiliza primitivas parametrizables, por ejemplo un cilindro con radio y altura variables.","source":"PDF Test Parcial 1","sourceUrl":null,"page":7,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2"},{"id":"pdf-030","tema":2,"question":"¿Cuál de las siguientes es una ventaja de los modelos de barrido?","options":["Representación matemática compleja","Alta capacidad de representar detall "explanation":"CSG define un sólido mediante operaciones sobre otros sólidos, por lo que describe con claridad interior y exterior.","source":"PDF Test Parcial 1","sourceUrl":null,"page":9,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2"},{"id":"pdf-037","tema":2,"question":"En el modelo poligonal, ¿qué lista se añade a los vértices y aristas para especificar las características físicas de las caras?","options":["Lista de atributos","Lista de nudos","Lista de curvas","Lista de mallas"],"correct":0,"hint":"¿Dónde guardarías materiales y normales de las caras?","explanation":"Los atributos pueden almacenar normales, colores, materiales u otras propiedades asociadas a las caras.","source":"PDF Test Parcial 1","sourceUrl":null,"page":9,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2"},{"id":"pdf-038","tema":2,"question":"¿Qué propiedad matemática se usa en las superficies libres para que la forma de los parches se vea continua?","options":["Interpolación de vectores","Continuidad geométrica","Proyección paramétrica","Modulación de derivadas"],"correct":1,"hint":"Piensa qué se necesita para unir parches sin bordes bruscos.","explanation":"Para unir parches sin saltos bruscos importa su continuidad geométrica en los bordes.","source":"PDF Test Parcial 1","sourceUrl":null,"page":9,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2"},{"id":"pdf-039","tema":2,"question":"¿En qué tipo de modelo geométrico se representa el objeto en celdas tridimensionales o voxeles?","options":["Modelo poligonal","Instanciación de primitivas","Enumeración espacial","CSG"],"correct":2,"hint":"Imagina un sólido discretizado en cubitos.","explanation":"Los vóxeles son pequeñas celdas volumétricas que se gestionan por enumeración espacial.","source":"PDF Test Parcial 1","sourceUrl":null,"page":9,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2"},{"id":"pdf-040","tema":2,"question":"¿Cuál de los siguientes es un método para generar un sólido utilizando una figura bidimensional y una trayectoria en el espacio?","options":["Superficie libre","NURBS","Modelo alámbrico.","Barrido"],"correct":3,"hint":"Piensa en extruir un perfil por un camino.","explanation":"El barrido combina un perfil 2D con una trayectoria en el espacio para generar geometría 3D.","source":"PDF Test Parcial 1","sourceUrl":null,"page":9,"status":"verified","correctedSourceKey":true,"theoryRef":"Apuntes oficiales · Tema 2"},{"id":"pdf-041","tema":3,"question":"¿Qué define a una transformación afín?.","options":["Cambia la forma de los elementos geométricos.","Conserva paralelismo y los puntos finitos.","Modifica la geometría tridimensional.","Cambia la dirección de los ejes de coordenadas."],"correct":1,"hint":"Compara paralelismo, ángulos y longitudes.","explanation":"Una transformación afín preserva puntos finitos, rectas y paralelismo; puede alterar ángulos y longitudes.","source":"PDF Test Parcial 1","sourceUrl":null,"page":10,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3"},{"id":"pdf-042","tema":3,"question":"En coordenadas homogéneas, ¿qué valor de el eje extra W permite que un punto mantenga la misma posición que en el espacio cartesiano?","options":["0","-1","1","2"],"correct":2,"hint":"Recuerda el significado del cuarto componente homogéneo.","explanation":"Con W = 1 las coordenadas homogéneas (x,y,z,1) equivalen directamente al punto cartesiano (x,y,z).","source":"PDF Test Parcial 1","sourceUrl":null,"page":11,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3"},{"id":"pdf-043","tema":3,"question":"¿Cuál es el efecto principal de una transformación de cuerpo rígido?","options":["Cambiar la forma de los objetos.","Cambiar las proporciones de los objetos y sus aristas.","Trasladar el objeto de un punto a otro del sistema de coordenadas.","Mantener la proporción de longitudes y los ángulos de aristas."],"correct":3,"hint":"¿Qué propiedades conserva una rotación/traslación rígida?","explanation":"Una transformación rígida conserva las distancias y ángulos internos del objeto, aunque cambie de posición u orientación.","source":"PDF Test Parcial 1","sourceUrl":null,"page":11,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3"},{"id":"pdf-044","tema":3,"question":"¿Cómo se representa la traslación de un objeto en geometría cartesiana?","options":["Con una multiplicación de matrices.","Con la suma de un vector de traslación.","Con la división de coordenadas.","Con el uso de funciones trigonométricas."],"correct":1,"hint":"Piensa en cómo desplazar todas las coordenadas la misma cantidad.","explanation":"Una traslación cartesiana suma un vector T a cada punto: P’ = P + T.","source":"PDF Test Parcial 1","sourceUrl":null,"page":11,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3"},{"id":"pdf-045","tema":3,"question":"En una rotación tridimensional, ¿qué representa el ángulo θ?","options":["La distancia entre el objeto y el origen.","El eje de rotación.","La cantidad de giro alrededor de un eje.","El ángulo de inclinación del eje Y."],"correct":2,"hint":"Un giro 3D necesita eje y magnitud de giro.","explanation":"El ángulo θ especifica cuánto se rota alrededor del eje elegido.","source":"PDF Test Parcial 1","sourceUrl":null,"page":11,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3"},{"id":"pdf-046","tema":3,"question":"¿Qué transforma una reflexión en el plano XY?","options":["Invierte el eje X.","Invierte el eje Z.","Invierte el eje Y..","Invierte los ejes X e Y."],"correct":1,"hint":"¿Qué eje es perpendicular al plano XY?","explanation":"Reflejar respecto al plano XY conserva X e Y e invierte el signo de Z.","source":"PDF Test Parcial 1","sourceUrl":null,"page":11,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3"},{"id":"pdf-047","tema":3,"question":"¿Qué ocurre en un escalado en tres dimensiones?","options":["Cambia el tamaño del objeto en uno o más ejes.","Modifica solo el ancho del objeto.","Preserva el tamaño inicial del objeto.","Solo modifica la altura del objeto."],"correct":0,"hint":"La escala puede variar de forma independiente en varios ejes.","explanation":"En un escalado 3D se multiplican las coordenadas por factores independientes para X, Y y Z.","source":"PDF Test Parcial 1","sourceUrl":null,"page":12,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3"},{"id":"pdf-048","tema":3,"question":"¿Qué propiedad tiene la transformación \"shear\" (desencajado)?","options":["Cambia la orientación del objeto.","Mantiene el paralelismo entre aristas.","Gira el objeto en el eje Z.","Mantiene la proporción de los ángulos."],"correct":1,"hint":"Piensa en una baraja inclinada mediante cizalla.","explanation":"El shear inclina un objeto manteniendo paralelas las rectas que originalmente lo eran; los ángulos suelen cambiar.","source":"PDF Test Parcial 1","sourceUrl":null,"page":12,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3"},{"id":"pdf-049","tema":3,"question":"En el desencajado de un eje, si se plantea la matriz H_AB, siendo A y B ejes coordenados, ¿qué determina el eje B?","options":["La columna de la matriz donde se coloca el valor de desencajado.","La fila de la matriz donde se coloca el valor de desencajado.","La rotación sobre dicho eje.","La traslación del objeto."],"correct":0,"hint":"Para esta pregunta importa la notación de la matriz usada en el temario.","explanation":"Según el Tema 3 (diapositiva 19), en la matriz H_AB el primer subíndice A determina la fila, que es la coordenada que cambia; el segundo B determina la columna donde se coloca el factor de desencajado. Ejemplo: H_xz modifica X en función de Z.","source":"PDF Test Parcial 1","sourceUrl":null,"page":12,"status":"verified","theoryRef":"Tema 3 · diapositiva 19","figure":"data:image/webp;base64,UklGRrK8AABXRUJQVlA4IKa8AADwcQKdASoaBE4CPnk6mUmkoyKhJBK6QJAPCWlu/BS0IKYUnpch2otdI97MVbXyvB4Mwwgnx7oa+V8fpoA+TwFfM/vKueL3Xr1zP4p04V9D+Kv6d+K/vw+HfpH9Z/vH+S/uX9h9K/xH5Z+vf2b/Kf5v+xf/L/a/Wj9Bfz3928t3nH7z/nP7r/qPYn+L/X37p/a/8t/vf  3"},{"id":"pdf-053","tema":3,"question":"¿Por qué son necesarias las coordenadas homogéneas?","options":["Porque es imposible realizar transformaciones con 3 ejes y se necesita uno extra.","Porque el escalado no se puede componer usando multiplicación de matrices con 3 ejes.","Porque si no las rotaciones son incorrectas (quaternions).","Porque la traslación no se puede componer usando multiplicación de matrices con 3 ejes."],"correct":3,"hint":"¿Qué operación no cabe en una matriz lineal 3×3?","explanation":"Las coordenadas homogéneas hacen posible incluir una traslación en una multiplicación matricial 4×4.","source":"PDF Test Parcial 1","sourceUrl":null,"page":13,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3"},{"id":"pdf-054","tema":3,"question":"¿Cómo se calcula el vector de vista para orientar la cámara?","options":["Usando la traslación de la cámara.","Usando el vector entre la posición de la cámara y el punto de mirada.","Aplicando una matriz de rotación.","A partir del ángulo de inclinación."],"correct":1,"hint":"Para orientar la cámara necesitas dos posiciones.","explanation":"El vector de vista apunta desde la cámara hacia el objetivo (o a la inversa, según la convención) y se obtiene restando posiciones.","source":"PDF Test Parcial 1","sourceUrl":null,"page":13,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3"},{"id":"pdf-055","tema":3,"question":"Al usar la matriz ModelView M para transformar vértices, ¿para qué se transforma también las normales mediante la matriz inversa correspondiente?","options":["Invertir las normales.","Preservar la escala de las normales.","Evitar el uso de coordenadas homogéneas.","Mantener la perpendicularidad de las normales."],"correct":3,"hint":"No transformes normales como si fueran posiciones.","explanation":"Según el Tema 3 (diapositiva 30), si los vértices se transforman con M, las normales se transforman con la inversa traspuesta (M⁻¹)ᵀ, para mantener su perpendicularidad respecto a la superficie heoryRef":"Apuntes oficiales · Tema 4"},{"id":"pdf-064","tema":4,"question":"¿Cuál es el propósito de los planos cercano y lejano en una proyección perspectiva?","options":["Ajustar la relación de aspecto","Limitar la cantidad de objetos visibles en la imagen","Reducir la resolución de la imagen","Mejorar la nitidez de los objetos cercanos"],"correct":1,"hint":"¿Qué limites espaciales tiene el volumen visible?","explanation":"Los planos cercano y lejano limitan el intervalo de profundidad del frustum que puede proyectarse.","source":"PDF Test Parcial 1","sourceUrl":null,"page":16,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4"},{"id":"pdf-065","tema":4,"question":"En una proyección ortográfica, ¿cuál es la principal característica de las líneas paralelas?","options":["Las líneas paralelas convergen en un punto","Las líneas paralelas se distorsionan","Las líneas paralelas siguen siendo paralelas tras la proyección","Las líneas paralelas se reducen a la mitad de su tamaño"],"correct":2,"hint":"¿Qué les ocurre a las paralelas al proyectarlas sin perspectiva?","explanation":"Una proyección ortográfica mantiene paralelas las líneas que son paralelas al plano de proyección.","source":"PDF Test Parcial 1","sourceUrl":null,"page":16,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4"},{"id":"pdf-066","tema":4,"question":"¿Cuál es la función de la relación de aspecto en una proyección?","options":["Definir la distancia focal","Modificar la orientación del plano de proyección","Proporcionar la proporción ancho:alto de la pantalla","Establecer los límites del campo de visión"],"correct":2,"hint":"Relaciona anchura y altura del área de imagen.","explanation":"La relación de aspecto es el cociente entre anchura y altura del área de imagen, por ejemplo 16:9.","source":"PDF Test Parcial 1","sourceUrl":null,"page":16,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4"},{"id":"pdf-067","tema":4,"question":"¿Qué tipo de proyección emplea un DP perpendicular al PP?","options":["Axonométrica","Caballera","Ortográfica","Dimétrica"],"correct":2,"hint":"Compara la dirección del rayo con la normal del plano.","explanation":"Cuando la dirección de proyección es perpendicular al plano, la proyección paralela es ortográfica.","source":"PDF Test Parcial 1","sourceUrl":null,"page":16,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4"},{"id":"pdf-068","tema":4,"question":"¿Cuál de las siguientes matrices se utiliza en OpenGL para crear una proyección perspectiva?","options":["glm:ortho()","glm:transform()","glm:frustum().","glm:rotate()"],"correct":2,"hint":"Distingue matrices de proyección ortográfica y perspectiva.","explanation":"glm::frustum construye una matriz de perspectiva con seis planos de delimitación; glm::ortho es ortográfica.","source":"PDF Test Parcial 1","sourceUrl":null,"page":16,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4"},{"id":"pdf-069","tema":4,"question":"En una proyección dimétrica, ¿qué relación tienen los ángulos entre los ejes?","options":["Los tres ángulos son distintos","Dos ángulos son iguales y uno distinto","Los ángulos son iguales entre sí","Uno de los ángulos es de 90°"],"correct":1,"hint":"Compara proyección iso-, di- y trimétrica.","explanation":"La proyección dimétrica presenta dos ejes con el mismo factor de reducción y un tercero distinto; sus relaciones angulares proyectadas se describen así en este temario.","source":"PDF Test Parcial 1","sourceUrl":null,"page":17,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4"},{"id":"pdf-070","tema":4,"question":"¿Para qué se utiliza el AABB en una proyección ortográfica?","options":["Mejorar la calidad de la imagen proyectada","Ajustar el campo de visión en el eje horizontal","Delimitar el área de visión en la proyección","Cambiar la relación de aspecto de la proyección"],"correct":2,"hint":"Imagina una caja definida por extremos mínimo y máximo.","explanation":"Un AABB (caja delimitadora alineada con los ejes) describe límites espaciales por coordenadas mínimas y máximas.","source":"PDF Test Parcial 1","sourceUrl":null,"page":17,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4"},{"id":"pdf-071","tema":5,"question":"¿Cuál es el propósito principal del recorte en gráficos por computador?","options":["Ampliar el área visible en pantalla","Limitar el número de polígonos en la escena","Excluir objetos o partes de objetos fuera de la visualización","Aumentar la resolución de la escena"],"correct":2,"hint":"¿Qué parte de la escena no tiene sentido rasterizar?","explanation":"El recorte suprime la geometría fuera del área visible para no rasterizar zonas que no aparecen en la imagen.","source":"PDF Test Parcial 1","sourceUrl":null,"page":18,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5"},{"id":"pdf-072","tema":5,"question":"¿Qué caracteriza el algoritmo de Cohen-Sutherland?","options":["El recorte de áreas de recorte de cualquier tipo","Una cuadrícula de 3×3 regiones, con el centro como zona visible","El recorte de polígonos sin incosistencias.","Recorte de polígonos"],"correct":1,"hint":"Piensa en códigos de regiones alrededor de una ventana.","explanation":"Cohen–Sutherland clasifica cada extremo con un código de región según una ventana rectangular: centro y ocho zonas exteriores.","source":"PDF Test Parcial 1","sourceUrl":null,"page":18,"status":"verified","figure":"data:image/webp;base64,UklGRsKiAABXRUJQVlA4ILaiAACwTgKdASoaBE8CPnk6mUmkoyKiI3PaAJAPCWlu/DTw/sj9m99k02E1tuuScUjWBrejzz/LSZtD306An5runbtte6get7/M+nWvpnxt/R/7z+tHmT/Rv6h/cv16/u/7L+0/4d8u/V/7T/j/8n/aP27+tf7W/nP7t5jPN/5X/S/5D1K/i/13+1/2X/If7v+3fvf8R/3n+xfst/iPRn8t/Y/9B/hP3K/ufyC/j/8l/tn9n/yP++/u3yXfIf8z/A9yDnf+x/03+U/db4BfVP5p/mP7t/n/+1/hf3r+LP2T/M/3X/P/9P+2///5E/P/7J/oP71/k/2f+wH+N/zv/Lf2z/If9z/F////4/dX+E8FP73/m/+3/o/gC/m/9f/63+F/137p/SV/J/9r/Kf6v9o/bj+Y/5P/uf6H/Y/tZ9g/8r/rv+7/wX+e/+f+Y/////8k/pUD/EiIiIiIiIiIiIiIiIiI7GQzcljTqqqmr1RmZmZmZmZmZmZmZ0SqqqqqqqrK9D++Dq0aNERu5zm5VIiJV/rcvSu5jtfCxl/S emiplanos de una ventana convexa; no está limitado a rectángulos.","source":"PDF Test Parcial 1","sourceUrl":null,"page":18,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5"},{"id":"pdf-075","tema":5,"question":"¿Qué representa el parámetro t en el algoritmo Cyrus-Beck?","options":["La distancia de la línea al origen","La dirección de la línea","La posición de un punto en la línea (mediante t)","El número de segmentos visibles"],"correct":2,"hint":"Un segmento se puede parametrizar entre sus extremos.","explanation":"El parámetro t ubica un punto P(t) = P0 + tD dentro de un segmento cuando 0 ≤ t ≤ 1.","source":"PDF Test Parcial 1","sourceUrl":null,"page":18,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5"},{"id":"pdf-076","tema":5,"question":"En el algoritmo Cyrus-Beck, si N · D = 0, ¿qué significa?","options":["La línea es visible en su totalidad","La línea es paralela y no hay intersección","La línea se encuentra dentro del área de recorte","La línea debe ser recortada en múltiples puntos"],"correct":null,"hint":"Paralelo no siempre significa completamente fuera.","explanation":"N · D = 0 significa que la recta es paralela al borde considerado (Tema 5, diapositiva 19). Por sí solo no permite determinar si el segmento está dentro o fuera; en el caso coincidente puede compartir infinitos puntos con ese borde.","source":"PDF Test Parcial 1","sourceUrl":null,"page":18,"status":"review","reviewNote":"La opción original añade «no hay intersección» sin especificar si la línea coincide con la frontera.","theoryRef":"Tema 5 · diapositiva 19"},{"id":"pdf-077","tema":5,"question":"¿Qué métodología utiliza el algoritmo Sutherland-Hodgman para recortar polígonos?","options":["Divide y vencerás","Algoritmo voraz","Backtracking","Rasterización"],"correct":0,"hint":"Piensa cómo se procesa un polígono borde a borde.","explanation":"El Tema 5 (diapositiva 40) describe explícitamente el recorte de Sutherland-Hodgman como un procedimiento basado en «divide y vencerás»: recorta el polígono sucesivamente contra cada borde y aplica cuatro reglas.","source":"PDF Test Parcial 1","sourceUrl":null,"page":19,"status":"verified","theoryRef":"Tema 5 · diapositiva 40"},{"id":"pdf-078","tema":5,"question":"En el algoritmo Sutherland-Hodgman, ¿qué ocurre con la lista de salida si el vértice de origen (O) de una arista está fuera del recorte y el de destino (D) está dentro?","options":["Se calcula ls intersección y se introduce en la lista","Se introduce el vértice de destino únicamente","Se calcula la intersección y se introduce con D","No se introduce ningún vértice"],"correct":2,"hint":"Examina un segmento que entra en el área visible.","explanation":"Al cruzar desde fuera hacia dentro se añade primero la intersección con el borde y luego el vértice de destino.","source":"PDF Test Parcial 1","sourceUrl":null,"page":19,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5"},{"id":"pdf-079","tema":5,"question":"¿Qué desventaja presenta el algoritmo Sutherland-Hodgman?","options":["Solo funciona en polígonos convexos","Genera polígonos adicionales innecesarios","Crea líneas indeseadas al unir el primer y último vértice","Solo funciona en entornos tridimensionales"],"correct":2,"hint":"¿Qué puede pasar al cerrar un polígono cóncavo?","explanation":"En polígonos cóncavos o desconectados, cerrar la lista como un único contorno puede crear segmentos artificiales.","source":"PDF Test Parcial 1","sourceUrl":null,"page":19,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5"},{"id":"pdf-080","tema":5,"question":"¿Cuál de los siguientes algoritmos permite recortar polígonos convexos y cóncavos sin problemas?","options":["Cohen-Sutherland","Cyrus-Beck","Sutherland-Hodgman","Weiler-Atherton"],"correct":3,"hint":"Piensa en algoritmos de contornos y agujeros.","explanation":"Weiler–Atherton recorre contornos y permite tratar polígonos cóncavos y regiones con huecos.","source":"PDF Test Parcial 1","sourceUrl":null,"page":19,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5"},{"id":"pdf-081","tema":5,"question":"¿En qué punto se inicia el trazado en el algoritmo Weiler-Atherton?","options":["En el punto más cercano al origen","En un punto de salida aleatorio","En un punto de entrada arbitrario","En el vértice central del polígono"],"correct":2,"hint":"Busca un punto donde el contorno entra al recorte.","explanation":"El algoritmo suele iniciar el seguimiento en una intersección de entrada y alterna entre los contornos.","source":"PDF Test Parcial 1","sourceUrl":null,"page":19,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5"},{"id":"pdf-082","tema":5,"question":"¿Cuándo termina el trazado en el algoritmo Weiler-Atherton?","options":["Cuando se recorre un solo lado","Cuando el área de recorte está totalmente definida","Cuando se completa un recorrido cerrado y vuelve al inicio","Cuando el número de vértices recorridos es el doble a los existentes."],"correct":2,"hint":"¿Cómo reconoces el final de un recorrido cerrado?","explanation":"El recorrido se cierra cuando retorna a la intersección inicial, formando un contorno completo.","source":"PDF Test Parcial 1","sourceUrl":null,"page":20,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5"},{"id":"daypo-primer-001","tema":1,"question":"En la fase de procesamiento de geometría del pipeline, cuando se hace la proyección...","options":["Se transforman las coordenadas 3D de las primitivas, ya recortadas, a coordenadas de pantalla 2D.","Los modelos aún no han pasado por el proceso de shading.","Ninguna de las anteriores es correcta.","Las primitivas aún no han pasado por el proceso de recortado."],"correct":3,"hint":"Distingue las etapas de proyección, recorte y mapeado a pantalla.","explanation":"La proyección se aplica durante el procesamiento geométrico; el recorte de las primitivas se realiza después.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 1","video":"Test gc primer parcial.mp4","videoQuestion":1},{"id":"daypo-primer-002","tema":2,"question":"Los modelos geométricos...","options":["Todas son correctas.","Deben mostrar bien los objetos y aplicar correctamente las operaciones que permite realizar.","Solo deben permitir una interpretación de la información.","Deben ser compactos para que la información no ocupe mucho espacio."],"correct":0,"hint":"Considera precisión, ausencia de ambigüedad y compacidad.","explanation":"Un buen modelo geométrico debe representar bien, ser no ambiguo y procurar ser compacto y útil.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2","video":"Test gc primer parcial.mp4","videoQuestion":2},{"id":"daypo-primer-003","tema":4,"question":"La proyección de perspectivas tiene varios subtipos dependiendo de...","options":["El número de ejes que el PP corta.","Ninguna es correcta.","El número de ejes que el CP corta.","El número de ejes que las LP cortan."],"correct":0,"hint":"Piensa en las perspectivas de uno, dos y tres puntos de fuga.","explanation":"Las proyecciones en perspectiva se clasifican por el número de ejes cortados por el plano de proyección (PP).","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4","video":"Test gc primer parcial.mp4","videoQuestion":3},{"id":"daypo-primer-004","tema":3,"question":"En el desencajado de un eje en cuerpos no rígidos...","options":["A indica el eje sobre el que se calcula el desencajado.","Tanto A como B indican las coordenadas distorsionadas (sobre las que se mueven los puntos).","B indica el eje sobre el que se moverán los puntos.","A indica el eje sobre el que se moverán los puntos."],"correct":3,"hint":"Distingue la coordenada que cambia de aquella que determina cuánto cambia.","explanation":"En la notación usada en estos apuntes, A indica el eje de desplazamiento de los puntos durante el shear.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3","video":"Test gc primer parcial.mp4","videoQuestion":4},{"id":"daypo-primer-005","tema":3,"question":"En una reflexión de cuerpos rígidos...","options":["Al haber 3 dimensiones, los planos pueden ser XY, YZ y XZ.","Se obtiene la forma en espejo del objeto respecto a un plano de coordenadas.","Todas son correctas.","Se obtiene mediante el producto matricial de una matriz identidad con un −1 en el eje que no está presente en el plano de reflexión."],"correct":2,"hint":"Reflejar sobre XY invierte la componente Z.","explanation":"Una reflexión crea el espejo respecto a un plano; la matriz invierte el eje perpendicular y puede hacerse sobre XY, XZ o YZ.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3","video":"Test gc primer parcial.mp4","videoQuestion":5},{"id":"daypo-primer-006","tema":1,"question":"¿Cuál de las siguientes afirmaciones sobre los gráficos por computador en 3D es correcta?","options":["Representan una escena 2D en una superficie tridimensional.","Representan en una escena 3D una superficie bidimensional.","Representan en una escena 2D una superficie tridimensional.","Representan una escena 3D en una superficie bidimensional."],"correct":3,"hint":"Compara la escena representada con el soporte de salida.","explanation":"La escena 3D se proyecta para obtener una imagen 2D visible en pantalla.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 1","video":"Test gc primer parcial.mp4","videoQuestion":6},{"id":"daypo-primer-007","tema":1,"question":"Cuando hablamos de una conversión de con  de proyección."],"correct":3,"hint":"Recuerda el flujo modelo → mundo → vista → recorte → dispositivo.","explanation":"El pipeline usa espacios como mundo, vista, recorte y coordenadas normalizadas de dispositivo. «Coordenadas de proyección» no es un espacio independiente en el listado del temario.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 1","video":"Test gc primer parcial.mp4","videoQuestion":20},{"id":"daypo-primer-021","tema":4,"question":"Indica qué afirmación es falsa sobre las proyecciones paralelas ortográficas.","options":["Se definen diferentes tipos si el DP coincide con un eje de proyección o no.","El DP es perpendicular al PP.","En las axonométricas el DP no coincide con ningún eje de proyección.","En las trimétricas, los tres ejes forman el mismo ángulo."],"correct":3,"hint":"Isométrica, dimétrica y trimétrica tienen relaciones angulares diferentes.","explanation":"En la proyección trimétrica los ejes no tienen todos ángulos iguales; eso caracteriza la isométrica.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4","video":"Test gc primer parcial.mp4","videoQuestion":21},{"id":"daypo-primer-022","tema":5,"question":"En el recorrido de los bordes del algoritmo Weiler-Atherton...","options":["El trazado sigue los vértices de la lista de la ventana de recorte.","El trazado sigue los vértices de la lista del polígono.","El trazado sigue los vértices de una lista, puede ser tanto la del polígono como la de la ventana de recorte.","Ninguna es correcta."],"correct":2,"hint":"Recuerda que el algoritmo alterna entre dos contornos.","explanation":"Weiler-Atherton sigue bordes tanto del polígono original como de la ventana de recorte al pasar por intersecciones.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html as NO es una característica propia de los B-Splines?","options":["Tiene continuidad C2 independiente de los puntos de control.","La malla de control tiene knots que se calculan por simplificación de las curvas.","Se necesitan como mínimo 16 puntos para poder representar una superficie bicúbica.","Tiene una formulación sencilla, ideal para la renderización a tiempo real."],"correct":3,"hint":"La evaluación de curvas/superficies puede requerir trabajo adicional.","explanation":"B-Splines permiten controlar superficies suaves, pero su formulación no es necesariamente simple ni especialmente apta para renderizado directo en tiempo real.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2","video":"Test gc primer parcial.mp4","videoQuestion":30},{"id":"daypo-primer-031","tema":2,"question":"Respecto a la geometría sólida conceptual (CSG)","options":["Los objetos se representan en árboles binarios que indican las operaciones entre primitivas.","Tiene limitaciones debido a las primitivas.","Todas son correctas.","Hacen uso de operaciones booleanas para permitir unión, intersección y diferencia."],"correct":2,"hint":"Recuerda las operaciones del árbol CSG.","explanation":"CSG representa sólidos combinando primitivas en árboles de operaciones booleanas; las primitivas disponibles introducen limitaciones.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2","video":"Test gc primer parcial.mp4","videoQuestion":31},{"id":"daypo-primer-032","tema":3,"question":"Indica qué afirmación es falsa respecto a la transformación de normales.","options":["La transformación se realiza en el modelo de proyección.","Se debe transformar tanto la geometría como los vectores asociados a dicha geometría.","Se deben normalizar las normales para evitar resultados incorrectos en posteriores cálculos de iluminación.","La multiplicación de la matriz ModelView a la matriz de transformación de los puntos es la transformación de vértice."],"correct":0,"hint":"Las normales deben transformarse en un espacio coherente con la geometría.","explanation":"Para iluminación se transforman normales usualmente con la inversa traspuesta de ModelView, no con la matriz de proyección.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3","video":"Test gc primer parcial.mp4","videoQuestion":32},{"id":"daypo-primer-033","tema":2,"question":"El método de barrido se basa en...","options":["La obtención del modelo en base a una forma bidimensional y una tridimensional sobre la que se realiza el barrido.","La obtención del modelo en base a una forma tridimensional sobre la que se realiza el barrido.","La obtención del modelo en base a una forma bidimensional sobre la que se realiza el barrido.","La obtención del modelo en base a una forma tridimensional y una bidimensional sobre la que se realiza el barrido."],"correct":0,"hint":"Recuerda extrusión y revolución de perfiles.","explanation":"El barrido lleva una sección 2D a lo largo de una trayectoria, que puede describirse en 3D, para generar un sólido.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2","video":"Test gc primer parcial.mp4","videoQuestion":33},{"id":"daypo-primer-034","tema":2,"question":"¿Cuál sería el orden para una superficie bicúbica?","options":["3","4","1","2"],"correct":1,"hint":"Una superficie bicúbica tiene grado tres en cada parámetro.","explanation":"En el temario se usa la convención de orden = grado + 1; por eso una superficie bicúbica es de orden 4.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2","video":"Test gc primer parcial.mp4","videoQuestion":34},{"id":"daypo-primer-035","tema":2,"question":"¿Cuál de las siguientes afirmaciones sobre las condiciones de frontera de las superficies libres es verdadera?","options":["Todas son correctas.","Los puntos extremos definen la posición exacta de los puntos en los extremos de la superficie.","Las derivadas primeras indican la dirección de la superficie en los extremos.","Las derivadas segundas regulan la curvatura de la superficie en los extremos."],"correct":0,"hint":"Piensa en valor de la función, primera derivada y segunda derivada.","explanation":"Las condiciones de frontera se describen por posiciones, tangentes (primera derivada) y curvatura (segunda derivada). La grabación no muestra tick en esta última, pero los apuntes confirman las tres.","source":"Daypo · Primer","sourceUrl":"https://www.daypo.com/gc-primer-parcial.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2","video":"Test gc primer parcial.mp4","videoQuestion":35},{"id":"daypo-noviembre-001","tema":4,"question":"Las proyecciones Paralelas Ortográficas se subclasifican según:","options":["Según el número de ejes que corta el plano de proyecciones (PP).","Según sea perpendicular o no la dirección de proyecciones (DP) con respecto al plano de proyecciones (PP).","Según coincida la dirección de proyecciones (DP) con algunos de los ejes.","Según el ángulo que forma la dirección de proyecciones (DP) con el plano de proyecciones (PP)."],"correct":2,"hint":"En las ortográficas, DP es perpendicular a PP.","explanation":"Se subclasifican según la coincidencia de la dirección DP con alguno de los ejes: vistas principales o axonométricas.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4","video":"Test gc noviembre.mp4","videoQuestion":1},{"id":"daypo-noviembre-002","tema":5,"question":"¿Qué algoritmo permite l","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3","video":"Test gc noviembre.mp4","videoQuestion":4},{"id":"daypo-noviembre-005","tema":4,"question":"Para subclasificar las proyecciones paralelas oblicuas en caballera, cabinet y otras, se emplea:","options":["El nº de cortes del plano de proyección con los ejes.","El ángulo que forma la dirección de proyecciones (DP) con los ejes.","El ángulo que forma la dirección de proyecciones (DP) con el plano de proyecciones (PP).","Dirección de proyecciones (DP)."],"correct":2,"hint":"Estas proyecciones no tienen DP perpendicular a PP.","explanation":"Los subtipos oblicuos se distinguen por el ángulo que forma la dirección de proyección con el plano.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4","video":"Test gc noviembre.mp4","videoQuestion":5},{"id":"daypo-noviembre-006","tema":5,"question":"En el algoritmo de Cohen-Sutherland, ¿qué ocurre cuando los dos criterios votan distinto?","options":["Que se debe dibujar o no la recta completa.","Que se debe dibujar siempre la recta.","Que se deben calcular intersecciones y dibujar solo la parte visible de la recta.","Que se debe rechazar siempre la recta."],"correct":2,"hint":"Recuerda aceptación trivial, rechazo trivial y caso de recorte.","explanation":"Si no se acepta ni se rechaza trivialmente, hay que calcular las intersecciones con la ventana para recortar el segmento.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5","video":"Test gc noviembre.mp4","videoQuestion":6},{"id":"daypo-noviembre-007","tema":2,"question":"¿Cuántas normales distintas se emplean para calcular el recubrimiento convexo?","options":["Tres","Una","Dos","Cuatro"],"correct":3,"hint":"La respuesta depende del objeto y de qué recubrimiento se esté describiendo.","explanation":"El vídeo marca cuatro; sin especificar una ventana o envolvente, la pregunta no fija el número de normales.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"review","theoryRef":"Apuntes oficiales · Tema 2","video":"Test gc noviembre.mp4","videoQuestion":7},{"id":"daypo-noviembre-008","tema":5,"question":"¿En el algoritmo de Cyrus-Beck cómo se detecta que nos salimos de las fronteras, aunque los valores de t estén entre 0 y 1?","options":["Validando que se cumple tE ≥ tS.","No se puede detectar.","Mediante el uso de ecuaciones paramétricas.","Es imposible que ocurra al ser la ventana convexa."],"correct":0,"hint":"Compara el valor de entrada con el valor de salida.","explanation":"Los apuntes rechazan cuando tE > tS y aceptan tE ≤ tS. El signo y la igualdad de la opción marcada son imprecisos para el rechazo.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"review","theoryRef":"Apuntes oficiales · Tema 5","video":"Test gc noviembre.mp4","videoQuestion":8},{"id":"daypo-noviembre-009","tema":5,"question":"En el algoritmo de Cohen-Sutherland, ¿cómo sabemos cuántas intersecciones se producen entre la recta y el área de recortado?","options":["El número de bits a 1 al hacer AND entre los códigos de los puntos.","El número de bits a 1 al hacer OR entre los códigos de los puntos.","El número de bits a 1 al hacer NAND entre los códigos de los puntos.","El número de bits a 1 al hacer XOR entre los códigos de los puntos."],"correct":1,"hint":"Los códigos de región sirven para rechazo y aceptación trivial.","explanation":"Ninguna operación OR/AND/XOR por sí sola da de forma general el número exacto de intersecciones: depende del trazado y la geometría.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"review","theoryRef":"Apuntes oficiales · Tema 5","video":"Test gc noviembre.mp4","videoQuestion":9},{"id":"daypo-noviembre-010","tema":3,"question":"¿Qué ventajas tienen las transformaciones geométricas homogéneas?","options":["Combinar distintas matrices al ser todas del mismo formato.","Multiplicar matrices con el tamaño que sea.","Multiplicar matrices en el orden que queramos.","Ninguna."],"correct":0,"hint":"Las matrices que se componen necesitan dimensiones compatibles.","explanation":"El espacio homogéneo unifica las transformaciones 3D como matrices 4×4, facilitando su composición.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3","video":"Test gc noviembre.mp4","videoQuestion":10},{"id":"daypo-noviembre-011","tema":4,"question":"Las proyecciones Perspectivas se subclasifican según:","options":["Según sea perpendicular o no la dirección de proyecciones (DP) con respecto al plano de proyecciones (PP).","Según el número de ejes que corta el plano de proyecciones (PP).","Según el ángulo que forma la dirección de proyecciones (DP) con el plano de proyecciones (PP).","Según coincida la dirección de proyecciones (DP) con algunos de los ejes."],"correct":1,"hint":"Piensa en los puntos de fuga.","explanation":"Se usan perspectivas de uno, dos y tres puntos de fuga, vinculadas al número de ejes que corta el plano de proyección.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4","video":"Test gc noviembre.mp4","videoQuestion":11},{"id":"daypo-noviembre-012","tema":3,"question":"¿Por qué las matrices 3D tienen 4 dimensiones?","options":["Mayor precisión.","Todas las anteriores.","Mayor velocidad.","Por las coordenadas homogéneas."],"correct":3,"hint":"La cuarta componente permite tratar traslaciones como multiplicaciones matriciales.","explanation":"Las transformaciones 3D se modelan con matrices 4×4 al usar coordenadas homogéneas.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3","video":"Test gc noviembre.mp4","videoQuestion":12},{"id":"daypo-noviembre-013","tema":4,"question":"Para clasificar las proyecciones paralelas y ortográficas se mira:","options":["Dirección de proyecciones (DP).","La posición en la dirección de proyecciones (DP) con respecto a los ejes.","El ángulo que forma la dirección de proyecciones (DP) con el plano proyectado.","Dónde está colocado el centro de proyecciones."],"correct":1,"hint":"Diferencia vistas principales de axonométricas.","explanation":"En las proyecciones paralelas ortográficas importa cómo se orienta DP respecto a los ejes.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4","video":"Test gc noviembre.mp4","videoQuestion":13},{"id":"daypo-noviembre-014","tema":5,"question":"En el algoritmo de Cyrus-Beck, la ecuación paramétrica sirve para:","options":["Saber si la recta a recortar es paralela a una de las fronteras.","Saber si nos encontramos en un punto fuera de la frontera de recortado.","Ninguno.","Saber si nos encontramos en un punto fuera de la recta a recortar."],"correct":1,"hint":"La ecuación describe P(t) sobre el segmento.","explanation":"P(t)=P0+(P1−P0)t permite encontrar intersecciones con las fronteras, pero el enunciado no expresa exactamente ese cálculo.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"review","theoryRef":"Apuntes oficiales · Tema 5","video":"Test gc noviembre.mp4","videoQuestion":14},{"id":"daypo-noviembre-016","tema":4,"question":"Las proyecciones Paralelas se subclasifican según:","options":["Según el ángulo que forma la dirección de proyecciones (DP) con el plano de proyecciones (PP).","Según el número de ejes que corta el plano de proyecciones (PP).","Según coincida la dirección de proyecciones (DP) con algunos de los ejes.","Según sea perpendicular o no la dirección de proyecciones (DP) con respecto al plano de proyecciones (PP)."],"correct":3,"hint":"Primero separa ortográficas y oblicuas.","explanation":"En proyecciones paralelas, DP perpendicular a PP da ortográficas; si no es perpendicular, son oblicuas.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 4","video":"Test gc noviembre.mp4","videoQuestion":16},{"id":"daypo-noviembre-017","tema":5,"question":"Cyrus-Beck se detecta si nos hemos salido de la frontera...","options":["No se detecta.","Calculando la intersección recta-frontera.","Calculando el mayor TE y el menor TS.","Si se sale de entre 0 y 1."],"correct":1,"hint":"El algoritmo compara entradas y salidas a través de los límites t.","explanation":"La forma precisa de decidir rechazo es comparar tE y tS: si tE>tS, no hay tramo visible. La opción marcada sobre la intersección no basta por sí sola.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"review","theoryRef":"Apuntes oficiales · Tema 5","video":"Test gc noviembre.mp4","videoQuestion":17},{"id":"daypo-noviembre-019","tema":3,"question":"Las matrices que se emplean en gráficos 3D son:","options":["Matrices con coordenadas traspuestas.","Matrices con coordenadas homogéneas.","Matrices con coordenadas no homogéneas.","Matrices con coordenadas semejantes."],"correct":1,"hint":"La composición de traslaciones requiere una coordenada adicional.","explanation":"Se usan representaciones homogéneas 4×4 para operar con transformaciones geométricas de puntos 3D.","source":"Daypo · Noviembre","sourceUrl":"https://www.daypo.com/gc-noviembre.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 3","video":"Test gc noviembre.mp4","videoQuestion":19},{"id":"daypo-763363-014","tema":5,"question":"En el algoritmo de Cyrus-Beck, la línea a dibujar es la formada por los puntos...","options":["P(max(tE)) y P(max(tS)).","P(min(tE)) y P(max(tS)).","P(max(tE)) y P(min(tS)).","P(min(tE)) y P(min(tS))."],"correct":2,"hint":"Se toma la entrada más tardía y la salida más temprana.","explanation":"El tramo visible entre los bordes convexos va de tE=max(entradas) a tS=min(salidas).","source":"Daypo · 763363","sourceUrl":"https://www.daypo.com/763363.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5","video":"Test gc 763363.mp4","videoQuestion":14},{"id":"daypo-763363-028","tema":1,"question":"¿En qué consiste el culling?","options":["Detectar caras visibles para solo pintar las que miran hacia el observador.","Detectar caras invisibles para rellenarlas siempre.","Acelerar el cálculo de z.","Mejorar la precisión del cálculo de la z para evitar artefactos."],"correct":0,"hint":"Identifica qué caras tienen orientación opuesta al observador.","explanation":"Back-face culling omite caras orientadas de espaldas a la cámara, evitando rasterizar fragmentos innecesarios.","source":"Daypo · 763363","sourceUrl":"https://www.daypo.com/763363.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 1","video":"Test gc 763363.mp4","videoQuestion":28},{"id":"daypo-763363-038","tema":2,"question":"¿Cuál es la principal diferencia entre las superficies NURBS y los B-Splines?","options":["La NURBS permite representar superficies cónicas de manera exacta, a diferencia del B-Spline.","La NURBS siempre cumple la propiedad de invarianza afín, a diferencia del B-Spline.","La NURBS utiliza puntos de control y vectores de nodos, mientras que B-Spline solo de control.","La NURBS es una superficie de interpolación, mientras que el B-Spline es de aproximación."],"correct":0,"hint":"NURBS introduce pesos racionales.","explanation":"NURBS puede representar exactamente circunferencias y secciones cónicas mediante formulación racional.","source":"Daypo · 763363","sourceUrl":"https://www.daypo.com/763363.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2","video":"Test gc 763363.mp4","videoQuestion":38},{"id":"daypo-763363-060","tema":2,"question":"¿Cuál de las siguientes no es una característica de los modelos alámbricos?","options":["Visualización ambigua.","Visualización muy rápida.","Visualización aproximada.","Guarda información sobre puntos interiores y exteriores."],"correct":3,"hint":"El alámbrico representa segmentos y vértices, no un sólido cerrado.","explanation":"El alámbrico no codifica interior/exterior; su visualización suele ser rápida pero puede ser ambigua.","source":"Daypo · 763363","sourceUrl":"https://www.daypo.com/763363.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 2","video":"Test gc 763363.mp4","videoQuestion":60},{"id":"daypo-763363-061","tema":5,"question":"Weiler-Atherton","options":["Cóncavo o convexo con o sin agujeros.","Convexo.","Cóncavo o convexo.","Cóncavo."],"correct":0,"hint":"Es un recortador general de polígonos con seguimiento de contornos.","explanation":"Weiler-Atherton permite tratar contornos convexos o cóncavos e incluso agujeros.","source":"Daypo · 763363","sourceUrl":"https://www.daypo.com/763363.html","page":null,"status":"verified","theoryRef":"Apuntes oficiales · Tema 5","video":"Test gc 763363.mp4","videoQuestion":61}];

<script>
(() => {
  'use strict';
  const RAW = Array.isArray(window.GC_QUESTIONS) ? window.GC_QUESTIONS : [];
  const IMPORT_KEY = 'gc-originals-import-v1';
  const canon = value => String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  function readImported(){try{const r=JSON.parse(localStorage.getItem(IMPORT_KEY)||'[]');return Array.isArray(r)?r:[];}catch(e){return [];}}
  function dedup(list){const seen=new Set();return list.filter(q=>{const k=canon(q.question);if(!k||seen.has(k))return false;seen.add(k);return true;});}
  const ALL = dedup([...RAW,...readImported()]);
  const READY = ALL.filter(q=>q.status==='verified' && Number.isInteger(q.correct) && q.correct>=0 && q.correct<4);
  const BY_ID = Object.fromEntries(ALL.map(q=>[q.id,q]));
  const TOPICS = ['Pipeline de renderización','Modelado geométrico','Transformaciones geométricas','Proyecciones','Recorte y algoritmos'];
  const ICONS = ['◈','⬡','⟲','◫','✂'];
  const STORE = 'gc-study-storage-v1';
  const defaults = {theme:'auto',shuffleQuestions:true,shuffleOptions:true,feedback:'instant',count:20,progress:{},history:[],session:null,installInfoDismissed:false};
  let state = load();
  let screen='home', config={mode:'random',topic:null,count:state.count||20,feedback:state.feedback||'instant',shuffleQuestions:state.shuffleQuestions!==false,shuffleOptions:state.shuffleOptions!==false};
  let session=state.session||null;
  let showSheet=false, showReview=false, bankFilter='all', installPrompt=null;
  const root=document.getElementById('app');
  function load(){try{let s=JSON.parse(localStorage.getItem(STORE)||'null');if(s && typeof s==='object')return {...defaults,...s,progress:s.progress||{},history:Array.isArray(s.history)?s.history:[]};}catch(e){}return {...defaults};}
  function save(){state.session=session;try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){console.warn('No se ha podido guardar',e);}}
  function progress(qid){return state.progress[qid]||{correct:0,wrong:0,streak:0,attempts:0,everWrong:false,mastered:false};}
  function countMastered(arr){return arr.filter(q=>progress(q.id).mastered).length;}
  function pct(a,b){return b?Math.round(100*a/b):0;}
  function figureMarkup(q){if(!q.figure)return '';const alt='Ilustración del temario: '+(q.theoryRef||'');return `<details class="theory-figure"><summary>▧ Ver imagen original de los apuntes</summary><img loading="lazy" src="${safeAttr(q.figure)}" alt="${safeAttr(alt)}"><small>${escapeHtml(q.theoryRef||'')}</small></details>`;}
  function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function safeAttr(x){return escapeHtml(x);}
  function shuffle(list){let xs=list.slice();for(let i=xs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[xs[i],xs[j]]=[xs[j],xs[i]];}return xs;}
  function tr(msg){return escapeHtml(msg);}
  function button(label,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${label}</button>`;}
  function topicName(i){return TOPICS[i-1]||`Tema ${i}`;}
  function theme(){if(state.theme==='auto')return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';return state.theme;}
  function applyTheme(){document.documentElement.dataset.theme=theme();document.querySelector('meta[name="theme-color"]').content=theme()==='dark'?'#0d1422':'#f6f8fc';}
  function percentBar(value){return `<div class="progressbar"><div style="width:${Math.max(0,Math.min(100,value))}%"></div></div>`;}
  function heading(eyebrow,title,sub){return `<p class="eyebrow">${eyebrow}</p><h1>${title}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}`;}
  function navBar(){const navItems=[['home','Inicio','⌂'],['topics','Temas','▦'],['bank','Preguntas','☷'],['stats','Progreso','◷'],['settings','Ajustes','⚙']];return `<nav class="desktop-nav" aria-label="Navegación principal">${navItems.map(([s,l])=>`<button data-action="screen" data-screen="${s}" class="${screen===s?'active':''}">${l}</button>`).join('')}</nav><button class="icon-btn" data-action="theme-cycle" title="Cambiar modo claro/oscuro" aria-label="Cambiar tema">${theme()==='dark'?'☀':'☾'}</button>`;}

    let correct=Number.isInteger(rawCorrect)?rawCorrect:null;
    if(correct===null){const str=String(rawCorrect).trim().toUpperCase();if(/^[A-D]$/.test(str))correct='ABCD'.indexOf(str);else if(/^[1-4]$/.test(str))correct=Number(str)-1;else if(str==='0')correct=0;}
    const isVerified=['verified','verificada','verificado'].includes(String(value('status','estado')).toLowerCase().trim());
    const explanation=String(value('explanation','explicacion')||'').trim();
    const hint=String(value('hint','ayuda','pista')||'').trim();
    return {id:'import-'+canon(pregunta).slice(0,100),tema,question:pregunta,options,correct:Number.isInteger(correct)&&correct>=0&&correct<4?correct:null,
      hint:hint||'Repasa el concepto correspondiente en los apuntes antes de elegir.',
      explanation:explanation||'Solución todavía pendiente de contrastar con los apuntes.',
      source:String(value('source','fuente')||'Cuestionario original importado'),sourceUrl:null,page:null,
      status:isVerified&&Number.isInteger(correct)&&correct>=0&&correct<4&&explanation?'verified':'review',
      theoryRef:String(value('theoryRef','referencia')||'Importado · pendiente de revisión'),
      reviewNote:isVerified&&Number.isInteger(correct)&&explanation?'':'Pendiente de validar con los apuntes antes de entrar en un test puntuado.'};
  }
  async function importFile(file){
    if(!file)return;
    try{
      if(file.size>5e6)throw Error('El archivo supera los 5 MB.');
      const raw=await file.text();let rows=file.name.toLowerCase().endsWith('.json')?JSON.parse(raw):parseCsv(raw);
      rows=Array.isArray(rows)?rows:rows.questions;
      if(!Array.isArray(rows))throw Error('El archivo debe contener un listado de preguntas.');
      const parsed=rows.map(readQuestion).filter(Boolean);
      if(!parsed.length)throw Error('No hay preguntas válidas. Comprueba las columnas de la plantilla y los temas 1-5.');
      const existing=readImported(), all=dedup([...RAW,...existing,...parsed]);
      const added=all.filter(q=>q.id.startsWith('import-')&&!existing.some(x=>x.id===q.id));
      const saved=all.filter(q=>q.id.startsWith('import-'));
      localStorage.setItem(IMPORT_KEY,JSON.stringify(saved));
      alert(`Archivo leído: ${parsed.length} preguntas válidas. Nuevas: ${added.length}. Repetidas: ${parsed.length-added.length}.\nSe recargará la app para actualizar el banco.`);
      location.reload();
    }catch(err){alert('No se han importado preguntas: '+err.message);}
  }
  function settings(){chrome(`${heading('Preferencias','Tu app, a tu manera','Los cambios de tema, el progreso y el historial se guardan automáticamente en este dispositivo.') }<div class="settinggroup"><h2>Apariencia</h2><select data-action="set-theme"><option value="auto" ${state.theme==='auto'?'selected':''}>Automático según móvil</option><option value="light" ${state.theme==='light'?'selected':''}>Claro</option><option value="dark" ${state.theme==='dark'?'selected':''}>Oscuro</option></select></div><div class="settinggroup"><h2>Cómo funciona el repaso</h2><p>Una pregunta queda dominada al acertarla dos veces consecutivas. Si fallas, la racha vuelve a cero. Las preguntas equivocadas aparecen en «Repasar fallos» hasta que las domines.</p><p>Si decides ver la corrección al final, las estadísticas se actualizan al finalizar el test. El avance de los tests sin terminar se conserva.</p></div><div class="settinggroup"><h2>Fuentes y respuestas dudosas</h2><p>El banco contiene ${ALL.length} preguntas en total: ${READY.length} puntuables y ${ALL.length-READY.length} pendientes de revisión. El PDF original tiene 82 preguntas. Las restantes proceden de las grabaciones de Daypo, tras eliminar duplicados.</p><p>Se han incorporado las preguntas de teoría recuperadas de tus vídeos de Daypo. Las de código CarGL, GLSL, llamadas de OpenGL y las de contenidos ajenos a estos cinco temas se han apartado. Los ticks verdes se han contrastado con los PDFs; las soluciones dudosas se muestran solo en el banco para revisión. Si tienes otros tests, puedes importar más preguntas originales (JSON/CSV).</p><a class="source-link" href="https://www.daypo.com/gc-primer-parcial.html" target="_blank" rel="noopener">GC Primer Parcial · Daypo <small>35 originales; pregunta de código excluida</small></a><a class="source-link" href="https://www.daypo.com/gc-noviembre.html" target="_blank" rel="noopener">GC Noviembre · Daypo <small>19 originales; deduplicadas y clasificadas</small></a><a class="source-link" href="https://www.daypo.com/763363.html" target="_blank" rel="noopener">GC · Daypo <small>87 originales; solo se usan las que corresponden a teoría de los temas 1–5</small></a><a class="source-link" href="https://www.daypo.com/autores.php?t=685435" target="_blank" rel="noopener">Tests por temas · Daypo <small>la página del autor no muestra sus tests sin acceso adicional</small></a><button class="btn secondary" style="margin-top:16px" data-action="screen" data-screen="import">Importar preguntas originales</button></div><div class="settinggroup"><h2>Instalación en Android</h2><p>Para instalarla como PWA, sube la carpeta a un alojamiento HTTPS (por ejemplo, GitHub Pages), entra desde Chrome en el Samsung y selecciona «Instalar aplicación» o «Añadir a pantalla de inicio». Tras la primera carga, podrás estudiar sin conexión gracias a la caché de archivos.</p><button class="btn secondary" data-action="install" ${installPrompt?'':'disabled'}>${installPrompt?'Instalar ahora':'Instalar (disponible desde HTTPS)'}</button></div><div class="settinggroup"><h2>Datos guardados</h2><p>No requiere usuario ni cuenta. Si borras los datos del navegador o la app, se pierde el progreso. No se envía información a servidores.</p><button class="btn danger" data-action="reset">Borrar progreso e historial</button></div>`);}
  function go(s){screen=s;showSheet=false;render();scrollTop();}
  function scrollTop(){try{window.scrollTo({top:0,behavior:'instant'});}catch(e){window.scrollTo(0,0);}}
  function handleAction(el,e){let a=el.dataset.action;
    if(a==='screen')return go(el.dataset.screen);
    if(a==='screen-home')return go('home');
    if(a==='theme-cycle'){state.theme=theme()==='dark'?'light':'dark';save();return render();}
    if(a==='configure'){config.mode=el.dataset.mode;config.topic=el.dataset.topic?Number(el.dataset.topic):null;config.count=state.count??20;config.feedback=state.feedback||'instant';config.shuffleQuestions=state.shuffleQuestions!==false;config.shuffleOptions=state.shuffleOptions!==false;return go('config');}
    if(a==='set-count'){config.count=el.dataset.count==='all'?'all':Number(el.dataset.count);return render();}
    if(a==='set-feedback'){config.feedback=el.dataset.feedback;return render();}
    if(a==='toggle-config'){config[el.dataset.prop]=el.checked;return render();}
    if(a==='set-theme'){state.theme=el.value;save();return render();}
    if(a==='start')return start();
    if(a==='resume')return go('quiz');
    if(a==='choose')return choose(Number(el.dataset.option));
    if(a==='next'){if(session.position<session.items.length-1)session.position++;save();render();scrollTop();return;}
    if(a==='prev'){if(session.position>0)session.position--;save();render();scrollTop();return;}
    if(a==='hint'){let i=session.position,p=session.hints.indexOf(i);if(p>=0)session.hints.splice(p,1);else session.hints.push(i);save();return render();}
    if(a==='explanation'){let i=session.position,p=session.explanations.indexOf(i);if(p>=0)session.explanations.splice(p,1);else session.explanations.push(i);save();return render();}
    if(a==='sheet'){showSheet=true;return render();}
    if(a==='sheet-close'){showSheet=false;return render();}
    if(a==='goto'){session.position=Number(el.dataset.index);showSheet=false;save();render();scrollTop();return;}
    if(a==='finish')return finish();
    if(a==='exit-quiz')return go('home');
    if(a==='bank-filter'){bankFilter=el.dataset.filter;return render();}
    if(a==='new-test'){config.mode='random';config.topic=null;return go('config');}
    if(a==='go-review'){config.mode='review';config.topic=null;return go('config');}
    if(a==='dismiss-install'){state.installInfoDismissed=true;save();return render();}
    if(a==='reset'){if(confirm('¿Seguro que quieres borrar tus estadísticas, historial y tests sin terminar? Esta acción no se puede deshacer.')){state.progress={};state.history=[];session=null;save();go('home');}return;}
    if(a==='install'){if(installPrompt)installPrompt.prompt();return;}
  }
  root.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;if(el.tagName==='A')e.preventDefault();if(el.dataset.action==='sheet-close'&&e.target!==el&&el.classList.contains('modal-layer'))return;if(el.tagName==='INPUT'||el.tagName==='SELECT')return;handleAction(el,e);});
  root.addEventListener('change',e=>{if(e.target.id==='gc-import-file'){importFile(e.target.files[0]);return;}let el=e.target.closest('[data-action]');if(el)handleAction(el,e);});
  if(window.matchMedia)matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(state.theme==='auto')applyTheme();});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(screen==='settings')render();});
  window.addEventListener('appinstalled',()=>{installPrompt=null;if(screen==='settings')render();});
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Sin service worker',e)));}
  render();
})();

</script>
